openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and signup operations
  - name: entries
    description: Culture explorer entries (artists, spaces, artifacts)
  - name: admin
    description: Admin curation endpoints (require x-admin-password header)
  - name: residency
    description: Artist-to-artist housing offers, creative spaces, and opportunities
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: fund
    description: Countercult Fund partner intake
  - name: pinterest
    description: Direct Pinterest OAuth and approved Pin publishing for the private Studio OS
  - name: bookingGuide
    description: Passphrase-protected GetYourGuide guest bonus
  - name: patronPost
    description: Patron Post membership progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patron-post/progress:
    get:
      operationId: getPatronPostProgress
      tags: [patronPost]
      summary: Read the current active Patron Post membership count
      responses:
        "200":
          description: Current active memberships and the public goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostProgress"

  /patron-post/questions:
    post:
      operationId: submitPatronPostQuestion
      tags: [patronPost]
      summary: Submit an anonymous question for a future issue
      description: No name, email, or IP is attached to the saved question. Questions are reviewed and may be answered in a future Patron Post issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatronPostQuestionInput"
      responses:
        "202":
          description: The question was received for editorial review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionSubmission"
        "400":
          description: The question is missing or outside the allowed length
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
        "429":
          description: Too many questions were submitted
        "503":
          description: The question could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"

  /studio/patron-post/questions:
    get:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: getStudioPatronPostQuestions
      tags: [patronPost]
      summary: List anonymous Patron Post questions for review
      responses:
        "200":
          description: Questions ordered by submission time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionsResponse"
        "401": { description: Studio access required }
        "503":
          description: Questions could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"

  /studio/patron-post/contributions:
    get:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: getStudioPatronPostContributions
      tags: [patronPost]
      summary: List live Patron Post contributions for Studio OS
      responses:
        "200":
          description: Contribution totals and recent records without donor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPatronPostContributionsResponse"
        "401": { description: Studio access required }
        "503":
          description: Contribution records could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/studio/patron-post/questions/{id}":
    patch:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: updateStudioPatronPostQuestionStatus
      tags: [patronPost]
      summary: Update the review status of an anonymous question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatronPostQuestionStatusUpdate"
      responses:
        "200":
          description: Updated anonymous question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionRecord"
        "400":
          description: Invalid question ID or review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
        "401": { description: Studio access required }
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
        "503":
          description: Question status could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
    delete:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: deleteStudioPatronPostQuestion
      tags: [patronPost]
      summary: Delete an anonymous Patron Post question
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Question deleted }
        "400":
          description: Invalid question ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
        "401": { description: Studio access required }
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"
        "503":
          description: Question could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronPostQuestionError"

  /auth/validate-location:
    post:
      operationId: validateSignupLocation
      tags: [auth]
      summary: Verify a city and country before member signup continues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupLocationInput"
      responses:
        "200":
          description: The city and country resolve to a mappable place
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupLocationResult"
        "400":
          description: The city and country could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupLocationError"

  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account and submit a Countercult member or partner application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRegistrationInput"
      responses:
        "201":
          description: Account and application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRegistrationResult"
        "400":
          description: The registration details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentMemberSession
      tags: [auth]
      summary: Return the current member session and saved profile preferences
      responses:
        "200":
          description: The signed-in account and linked profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSessionResponse"
        "401":
          description: The session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/preferences:
    patch:
      operationId: updateMemberPreferences
      tags: [auth]
      summary: Save optional newsletter and rural-discovery preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPreferencesInput"
      responses:
        "200":
          description: The saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPreferencesResponse"
        "400":
          description: The preference values are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The session is missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The account or its member profile could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exchange-digest/unsubscribe:
    get:
      operationId: confirmExchangeDigestUnsubscribe
      tags: [auth]
      summary: Show an explicit confirmation before stopping the weekly Exchange digest
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Confirmation page; opening the link does not unsubscribe automatically
          content:
            text/html:
              schema: { type: string }
        "400":
          description: The unsubscribe link is invalid
          content:
            text/html:
              schema: { type: string }
        "410":
          description: The unsubscribe link has already been used
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: unsubscribeFromExchangeDigest
      tags: [auth]
      summary: Stop weekly Exchange digest emails using the signed unsubscribe token
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: The weekly Exchange digest is stopped
          content:
            text/html:
              schema: { type: string }
        "400":
          description: The unsubscribe link is invalid
          content:
            text/html:
              schema: { type: string }

  /auth/space-claims/inspect:
    post:
      operationId: inspectSpaceClaimInvitation
      tags: [auth]
      summary: Validate a one-time invitation to claim an existing space listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceClaimTokenInput"
      responses:
        "200":
          description: Invitation details and account setup requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceClaimInvitationDetails"
        "400":
          description: Invitation is invalid, expired, used, or no longer claimable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/space-claims/accept:
    post:
      operationId: acceptSpaceClaimInvitation
      tags: [auth]
      summary: Accept a verified space claim invitation and link the existing listing to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceClaimAcceptInput"
      responses:
        "200":
          description: Existing listing claimed and a password-authenticated session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceClaimAcceptResult"
        "400":
          description: Invalid invitation or account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: The password did not authenticate the existing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The listing is already claimed or the email belongs to an account that must sign in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/pins:
    get:
      operationId: listEntryPins
      tags: [entries]
      summary: Lightweight public or approved-network pin list
      description: Anonymous callers receive public non-artist pins and limited previews for public artist pins, including older public profiles without a recorded consent entry. Artist preview pins include display name, city and country, tags, and approximate coordinates; profile photos are included only when public profile consent is recorded. Full artist details, contact information, and portfolio media remain available only to approved network members.
      responses:
        "200":
          description: Pin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryPin"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List entries (for the side panel)
      description: Anonymous callers receive public non-artist entries. Approved network members also receive public and network-only artist entries.
      responses:
        "200":
          description: Entry list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrySummary"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Submit a new entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/space-suggestions:
    post:
      operationId: createSpaceSuggestion
      tags: [entries]
      summary: Suggest a public cultural space without claiming it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceSuggestionInput"
      responses:
        "201":
          description: Space published as community-submitted and unclaimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceSuggestionCreated"
        "400":
          description: Invalid or unmappable suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A likely duplicate already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/voices:
    get:
      operationId: listPublicVoices
      tags: [entries]
      summary: List approved member voices for the public homepage
      description: Returns join answers only from published, approved, visible, non-deleted entries. Artists appear only when separately selected for public voice cards.
      responses:
        "200":
          description: Public member voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicVoice"

  /entries/site-cards:
    get:
      operationId: listPublicArtistCards
      tags: [entries]
      summary: List artists who consented to public profile cards
      description: Returns minimal teaser cards for all approved, published artists who chose public profile visibility. Full artist profiles and portfolio media remain member-only.
      responses:
        "200":
          description: Public artist card data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicArtistCard"

  /entries/{id}/discover-links:
    get:
      operationId: discoverEntryLinks
      tags: [entries]
      summary: Auto-discover social/web links for an entry (cached in DB after first call)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discovered links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalLink"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}/claim/request:
    post:
      operationId: requestClaimCode
      tags: [entries]
      summary: Send a one-time code to the artist's email to verify ownership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequestBody"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}/claim/verify:
    post:
      operationId: verifyClaimCode
      tags: [entries]
      summary: Verify the one-time code and open a claim session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimVerifyBody"
      responses:
        "200":
          description: Verified — claim session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimSession"
        "400":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}/claim:
    post:
      operationId: claimEntry
      tags: [entries]
      summary: Save pitchbook profile (requires claim session token in Authorization header)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimEntryBody"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          description: Invalid or expired session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Full entry details for public places or approved network members
      description: Artists require an approved network session. Public site-card exceptions reveal only card data, not the full profile.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /adverts:
    get:
      operationId: listAdverts
      tags: [adverts]
      summary: List adverts
      responses:
        "200":
          description: Active adverts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advert"
    post:
      operationId: createAdvert
      tags: [adverts]
      summary: Publish a free advert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertInput"
      responses:
        "201":
          description: Advert published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertCreated"
        "400":
          description: Invalid advert details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Advert could not be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /residency:
    get:
      operationId: listResidencyOffers
      tags: [residency]
      summary: List active housing, space, and opportunity offers
      responses:
        "200":
          description: List of offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidencyOffer"
    post:
      operationId: createResidencyOffer
      tags: [residency]
      summary: Post a housing, space, or opportunity offer (requires claim session token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewResidencyOffer"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyOffer"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /residency/homepage-picks:
    get:
      operationId: listHomepageExchangePicks
      tags: [residency]
      summary: List recent public Exchange homepage offers
      responses:
        "200":
          description: Two newest active public-safe offers followed by an optional curator pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageExchangePicks"

  /admin/residency/homepage-picks:
    patch:
      operationId: updateHomepageExchangePicks
      tags: [admin, residency]
      summary: Select one public-safe Exchange offer for the homepage's third card
      parameters:
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomepageExchangePicksOrderInput"
      responses:
        "200":
          description: Saved curator order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageExchangePicksOrder"
        "400":
          description: One or more offers are not eligible for public featuring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /residency/{id}:
    patch:
      operationId: updateResidencyOffer
      tags: [residency]
      summary: Edit your housing, space, or opportunity offer (requires claim session)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResidencyOffer"
      responses:
        "200":
          description: Updated offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyOffer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteResidencyOffer
      tags: [residency]
      summary: Delete your offer (requires claim session)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/residency/matching:
    get:
      operationId: getResidencyMatchingWorkspace
      tags: [residency]
      summary: Load the private Exchange Residency matching workspace
      parameters:
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private applicants and shortlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyMatchingWorkspace"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/residency/{applicantId}/shortlist:
    post:
      operationId: createResidencyShortlist
      tags: [residency]
      summary: Add a private candidate to an Exchange Residency applicant shortlist
      parameters:
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidencyShortlistInput"
      responses:
        "201":
          description: Shortlist entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyShortlist"
        "400":
          description: Invalid applicant or partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Shortlist limit or duplicate candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/residency/shortlist/{id}:
    patch:
      operationId: updateResidencyShortlist
      tags: [residency]
      summary: Update private matching notes or mark a pair as matched
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-admin-password
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidencyShortlistUpdate"
      responses:
        "200":
          description: Updated shortlist entry
          content:
            application/json:
              schema:
