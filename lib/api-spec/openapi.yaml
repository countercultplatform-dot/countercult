      responses:
        "201":
          description: Artwork saved and Pinterest publishing started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioArtworkCreateResponse" }
        "400": { description: Invalid artwork record }
        "401": { description: Studio access key required }

  /studio/artworks/pinterest:
    get:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: listStudioArtworkPinterest
      tags: [studio]
      summary: List durable artwork Pinterest publishing records
      responses:
        "200":
          description: Artwork Pinterest publishing history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudioArtworkPinterestRecord" }
        "401": { description: Studio access key required }

  /studio/artworks/{id}/retry-pinterest:
    post:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: retryStudioArtworkPinterest
      tags: [studio]
      summary: Retry Pinterest publishing for an artwork
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pinterest publishing state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioArtworkPinterestStatus" }
        "401": { description: Studio access key required }
        "404": { description: Artwork or Pinterest record not found }

  /pinterest/oauth/callback:
    get:
      operationId: pinterestOAuthCallback
      tags: [pinterest]
      summary: Complete the Pinterest OAuth flow
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect back to the Studio OS Pinterest desk }

  /pinterest/status:
    get:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: getPinterestStatus
      tags: [pinterest]
      summary: Return the current Pinterest connection status
      responses:
        "200":
          description: Pinterest connection status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinterestStatus" }

  /pinterest/boards:
    get:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: listPinterestBoards
      tags: [pinterest]
      summary: List boards from the connected Pinterest account
      responses:
        "200":
          description: Pinterest boards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinterestBoardsResponse" }
        "401": { description: Studio access key required }
        "409": { description: Pinterest is not connected }
  /pinterest/boards/sync:
    post:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: syncPinterestBoards
      tags: [pinterest]
      summary: Create any missing Studio OS boards in Pinterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinterestBoardSyncInput" }
      responses:
        "200":
          description: Synced Pinterest boards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinterestBoardsResponse" }

  /pinterest/pins:
    post:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: publishPinterestPin
      tags: [pinterest]
      summary: Publish one approved Pin to Pinterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinterestPublishPinInput" }
      responses:
        "201":
          description: Published Pinterest Pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinterestPublishPinResponse" }
        "400": { description: Invalid Pin payload }
        "401": { description: Studio access key required }
        "409": { description: Pinterest is not connected }

  /pinterest/disconnect:
    post:
      security: [{ adminPassword: [] }, { studioSessionCookie: [] }]
      operationId: disconnectPinterest
      tags: [pinterest]
      summary: Remove the stored Pinterest connection
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminPassword:
      type: apiKey
      in: header
      name: x-admin-password
    studioSessionCookie:
      type: apiKey
      in: cookie
      name: studio_access
  parameters:
    EntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PatronPostProgress:
      type: object
      properties:
        activeMembers:
          type: integer
          minimum: 0
        goal:
          type: integer
          const: 1000
      required:
        - activeMembers
        - goal

    PatronPostQuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 10
          maxLength: 1200
      required: [question]

    PatronPostQuestionSubmission:
      type: object
      properties:
        submitted:
          type: boolean
          const: true
        message:
          type: string
      required: [submitted, message]

    PatronPostQuestionStatus:
      type: string
      enum: [new, reviewed]

    PatronPostQuestionRecord:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        status:
          $ref: "#/components/schemas/PatronPostQuestionStatus"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, question, status, createdAt, reviewedAt]

    PatronPostQuestionsResponse:
      type: array
      items:
        $ref: "#/components/schemas/PatronPostQuestionRecord"

    ArtHouseApplicationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        applyingAs:
          type: string
          enum: [solo, duo]
        secondArtistName:
          type: string
          maxLength: 120
        portfolioUrl:
          type: string
          format: uri
          maxLength: 500
        availableFrom:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        availableTo:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        residencyPlan:
          type: string
          minLength: 10
          maxLength: 2000
        sharedLiving:
          type: string
          minLength: 10
          maxLength: 1200
        friendsDescription:
          type: string
          minLength: 10
          maxLength: 1000
        networkMember:
          type: boolean
        networkConnection:
          type: string
          maxLength: 1200
        considerPatronPost:
          type: boolean
        privacyConsent:
          type: boolean
          const: true
        honeypot:
          type: string
          maxLength: 0
      required:
        - name
        - email
        - applyingAs
        - portfolioUrl
        - availableFrom
        - availableTo
        - residencyPlan
        - sharedLiving
        - friendsDescription
        - networkMember
        - considerPatronPost
        - privacyConsent

    ArtHouseApplicationSubmission:
      type: object
      properties:
        submitted:
          type: boolean
          const: true
      required: [submitted]

    ArtHouseApplicationStatus:
      type: string
      enum: [new, reviewed]

    ArtHouseApplicationRecord:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        applyingAs:
          type: string
          enum: [solo, duo]
        secondArtistName:
          type: ["string", "null"]
        portfolioUrl:
          type: string
          format: uri
        availableForAllDates:
          type: boolean
        availableFrom:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        availableTo:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        residencyPlan:
          type: string
        sharedLiving:
          type: string
        friendsDescription:
          type: string
        networkMember:
          type: boolean
        networkConnection:
          type: string
        considerPatronPost:
          type: boolean
        privacyConsentAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ArtHouseApplicationStatus"
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - name
        - email
        - applyingAs
        - secondArtistName
        - portfolioUrl
        - availableForAllDates
        - availableFrom
        - availableTo
        - residencyPlan
        - sharedLiving
        - friendsDescription
        - networkMember
        - networkConnection
        - considerPatronPost
        - privacyConsentAt
        - status
        - createdAt
        - reviewedAt

    ArtHouseApplicationsResponse:
      type: array
      items:
        $ref: "#/components/schemas/ArtHouseApplicationRecord"

    ArtHouseApplicationStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ArtHouseApplicationStatus"
      required: [status]

    PatronPostQuestionStatusUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PatronPostQuestionStatus"
      required: [status]

    PatronPostQuestionError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    PatronPostContributionBeneficiary:
      type: string
      enum: ["Countercult", "Sketchy Shona"]

    PatronPostContributionStatus:
      type: string
      enum: [paid, open, unpaid, expired]

    PatronPostContributionRecord:
      type: object
      properties:
        id:
          type: string
        beneficiary:
          $ref: "#/components/schemas/PatronPostContributionBeneficiary"
        amountCents:
          type: ["integer", "null"]
        currency:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/PatronPostContributionStatus"
      required: [id, beneficiary, amountCents, currency, createdAt, status]

    PatronPostContributionTotal:
      type: object
      properties:
        beneficiary:
          $ref: "#/components/schemas/PatronPostContributionBeneficiary"
        currency:
          type: string
        paidCount:
          type: integer
          minimum: 0
        paidAmountCents:
          type: integer
          minimum: 0
      required: [beneficiary, currency, paidCount, paidAmountCents]

    StudioPatronPostContributionsResponse:
      type: object
      properties:
        totals:
          type: array
          items:
            $ref: "#/components/schemas/PatronPostContributionTotal"
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/PatronPostContributionRecord"
      required: [totals, contributions]

    SpaceClaimInvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        scheduledAt:
          type: string
          format: date-time
        verificationConfirmed:
          type: boolean
          const: true
      required: [email, verificationConfirmed]

    CuratedPinInput:
      type: object
      properties:
        sourceKey: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [artist, space] }
        city: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, minLength: 1, maxLength: 100 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        url: { type: string, format: uri, maxLength: 1000 }
        tags:
          type: array
          items: { type: string, maxLength: 80 }
        contactEmail:
          type: ["string", "null"]
          format: email
          maxLength: 320
        replaceEntryId:
          type: integer
          minimum: 1
      required: [sourceKey, name, kind, city, country, lat, lng, url, tags]

    CuratedPinBatchInput:
      type: object
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 55
          items:
            $ref: "#/components/schemas/CuratedPinInput"
        retireEntryIds:
          type: array
          maxItems: 55
          items: { type: integer, minimum: 1 }
      required: [entries]

    CuratedPinBatchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              sourceKey: { type: string }
              id: { type: integer }
              action: { type: string, enum: [created, existing] }
            required: [sourceKey, id, action]
      required: [results]

    SpaceClaimInvitationResult:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        entryId:
          type: integer
        entryName:
          type: string
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
      required: [ok, entryId, entryName, email, expiresAt]

    SpaceClaimTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 12
          maxLength: 64
          pattern: "^(?:[A-F0-9]{12}|[a-f0-9]{64})$"
      required: [token]

    SpaceClaimInvitationDetails:
      type: object
      properties:
        entryId:
          type: integer
        entryName:
          type: string
        city:
          type: string
        country:
          type: string
        email:
          type: string
          format: email
        hasAccount:
          type: boolean
        hasPassword:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      required: [entryId, entryName, city, country, email, hasAccount, hasPassword, expiresAt]

    SpaceClaimAcceptInput:
      type: object
      properties:
        token:
          type: string
          minLength: 12
          maxLength: 64
          pattern: "^(?:[A-F0-9]{12}|[a-f0-9]{64})$"
        password:
          type: string
          minLength: 8
          maxLength: 200
        displayName:
          type: string
          minLength: 1
          maxLength: 120
      required: [token, password]

    SpaceClaimAcceptResult:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        token:
          type: string
        email:
          type: string
          format: email
        isApproved:
          type: boolean
        canPostPartnerOffers:
          type: boolean
        accountRole:
          type: string
          enum: [member, partner_poster]
        displayName:
          type: ["string", "null"]
        entryId:
          type: integer
        entryName:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [ok, token, email, isApproved, canPostPartnerOffers, accountRole, entryId, entryName, expiresAt]

    EntryKind:
      type: string
      enum: [artist, space, artifact]

    EntryPin:
      type: object
      properties:
        id:
          type: integer
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        kind:
          $ref: "#/components/schemas/EntryKind"
        secondaryKind:
          oneOf:
            - $ref: "#/components/schemas/EntryKind"
            - type: "null"
        name:
          type: string
          description: The artist's public display name in a limited map preview; no biography or contact details are included.
        city:
          type: string
        country:
          type: string
        tags:
          type: array
          items:
            type: string
        heroPhoto:
          type: ["string", "null"]
          description: Included only when public profile consent is recorded; portfolio media is never included in a public preview.
        isProfilePreview:
          type: boolean
          description: True when this is a limited public artist preview rather than an approved-member pin.
      required: [id, kind]

    EntrySummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        secondaryKind:
          oneOf:
            - $ref: "#/components/schemas/EntryKind"
            - type: "null"
        tags:
          type: array
          items:
            type: string
        openTo:
          type: array
          items:
            type: string
        basedIn:
          type: array
          description: Additional cities where this public profile is based.
          items:
            type: string
        city:
          type: string
        country:
          type: string
        heroPhoto:
          type: ["string", "null"]
        isClaimed:
          type: boolean
        isCommunitySubmitted:
          type: boolean
        hasContactEmail:
          type: boolean
          description: Whether a contact email is on file, without exposing the address itself.
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        shopUrl:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
      required: [id, name, kind, tags, basedIn, city, country, isClaimed, isCommunitySubmitted, hasContactEmail]

    PublicArtistCard:
      type: object
      description: Minimal teaser data for an artist who explicitly consented to a public profile.
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        city:
          type: string
        country:
          type: string
        tags:
          type: array
          items:
            type: string
        openTo:
          type: array
          items:
            type: string
        offeringChoices:
          type: array
          description: Broad selected offering categories only; free-text offering details are withheld.
          items:
            type: string
        heroPhoto:
          type: ["string", "null"]
      required: [id, name, kind, city, country, tags, openTo, offeringChoices, heroPhoto]

    PublicVoice:
      type: object
      description: A join answer from an approved, published member profile; artist answers are returned only when selected for public voice cards.
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        city:
          type: string
        country:
          type: string
        joinReason:
          type: string
      required: [id, name, kind, city, country, joinReason]

    ExternalLink:
      type: object
      properties:
        platform:
          type: string
        url:
          type: string
      required: [platform, url]

    Entry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        secondaryKind:
          oneOf:
            - $ref: "#/components/schemas/EntryKind"
            - type: "null"
        tags:
          type: array
          items:
            type: string
        subcultures:
          type: array
          items:
            type: string
        city:
          type: string
        country:
          type: string
        postal:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        blurb:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        heroPhoto:
          type: ["string", "null"]
        portfolioPhotos:
          type: array
          items:
            type: string
        isClaimed:
          type: boolean
        hasContactEmail:
          type: boolean
          description: Whether a contact email is on file, without exposing the address itself.
        scrapingConsent:
          type: boolean
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        discoveredLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        shopUrl:
          type: ["string", "null"]
        offerings:
          type: ["string", "null"]
          description: Plain-language ways people can work with or buy from this profile
        organizationModel:
          type: ["string", "null"]
          enum: [artist_run, nonprofit, community, independent, commercial_operator, hospitality, agency, institution, other, null]
        intendedCommercialUse:
          type: ["boolean", "null"]
        derivedClassification:
          type: string
          enum: [independent, commercial, needs_review]
        basedIn:
          type: array
          items:
            type: string
        openTo:
          type: array
          items:
            type: string
          description: Artist availability signals (e.g. "residencies", "commissions")
        spaceOfferAvailable:
          type: boolean
          description: Whether a space is open to sharing its venue with artists
        spaceOfferTypes:
          type: array
          items:
            type: string
          description: Types of artist activity the space can host
        spaceOfferCategory:
          type: ["string", "null"]
          enum: [work, housing, residency, null]
          description: Whether the offer is for creative work, housing, or a live-in residency
        spaceOfferPricing:
          type: ["string", "null"]
          enum: [free, paid, case_by_case, null]
          description: Whether the venue offer is free, paid, or decided per collaboration
        spaceOfferDetails:
          type: ["string", "null"]
          description: Additional details about the venue offer
        isHidden:
          type: boolean
          description: Whether this entry is hidden from public listings
        createdAt:
          type: string
          format: date-time
      required:
        [
          id,
          name,
          kind,
          tags,
          subcultures,
          city,
          country,
          portfolioPhotos,
          isClaimed,
          hasContactEmail,
          scrapingConsent,
          createdAt,
        ]

    PublicEntry:
      type: object
      description: Public entry details. Private contact, consent, discovery, moderation, and space-offer fields are never returned here.
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          $ref: "#/components/schemas/EntryKind"
        secondaryKind:
          oneOf:
            - $ref: "#/components/schemas/EntryKind"
            - type: "null"
        tags:
          type: array
          items:
            type: string
        subcultures:
          type: array
          items:
            type: string
        city:
          type: string
        country:
          type: string
        postal:
          type: "null"
        address:
          type: "null"
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        blurb:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        websitePreview:
          oneOf:
            - $ref: "#/components/schemas/WebsitePreview"
            - type: "null"
        heroPhoto:
          type: ["string", "null"]
        portfolioPhotos:
          type: array
          items:
            type: string
        isClaimed:
          type: boolean
        isCommunitySubmitted:
          type: boolean
          description: This space was suggested by the community and is not an owner endorsement.
        claimRequestAvailable:
          type: boolean
          description: Whether this listing has no existing owner contact, is not owner-submitted or claimed, and is eligible for a manual access request.
        externalLinks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalLink"
        experiences:
          type: array
          items:
            $ref: "#/components/schemas/Experience"
        shopUrl:
          type: ["string", "null"]
        offerings:
          type: ["string", "null"]
        basedIn:
          type: array
          items:
            type: string
        openTo:
          type: array
          items:
            type: string
      required:
        [
          id,
          name,
          kind,
          tags,
          subcultures,
          city,
          country,
          postal,
          address,
          portfolioPhotos,
          isClaimed,
          isCommunitySubmitted,
          claimRequestAvailable,
          externalLinks,
          experiences,
          basedIn,
          openTo,
          websitePreview,
        ]

    WebsitePreview:
      type: object
      properties:
        sourceUrl:
          type: string
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        fetchedAt:
          type: string
          format: date-time
      required: [sourceUrl, title, description, imageUrl, fetchedAt]

    SpaceSuggestionInput:
      type: object
      required: [name, city, country]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 120 }
        country: { type: string, minLength: 1, maxLength: 120 }
        url: { type: ["string", "null"], format: uri, maxLength: 2048 }
        blurb: { type: ["string", "null"], maxLength: 600 }
        heroPhoto: { type: ["string", "null"], maxLength: 2048 }
        offerings: { type: ["string", "null"], maxLength: 1200 }
        offeringChoices:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 120 }
        basedIn:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 120 }
        networkNextSteps: { type: ["string", "null"], maxLength: 1200 }
        discoverySource: { type: ["string", "null"], maxLength: 600 }
        profileVisibility: { type: string, enum: [public, network] }
        profileVisibilityConsent: { type: boolean }
        publicProfileConsent: { type: boolean }
        adultConfirmed: { type: boolean }
        spaceOfferAvailable: { type: boolean }
        spaceOfferTypes:
          type: array
